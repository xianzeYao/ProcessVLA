run_id: qwen35_gr00t_libero_text
run_root_dir: /root/data/yxz/outputs
seed: 42
wandb_entity: yao-xian-ze
wandb_project: CoT
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00TTextUVDPrompt
  condition_mode: text
  freeze_qwen: true
  qwenvl:
    base_vlm: /root/data/yxz/models/Qwen3.5-4B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
  vla_data:
    dataset_py: text_uvd_lerobot_datasets
    dataformat: lerobot
    data_root_dir: /root/data/yxz/datasets/libero_rerender
    data_mix: libero_text_uvd_all
    condition_mode: text
    sequential_step_sampling: false
    action_type: delta_qpos
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    include_state: false
    cot_sidecar_dir: meta/embodied_cot
    text_uvd:
      action_horizon: 8
      uvd_depth_scale: 1.0
      source_width: 256
      source_height: 256
      target_width: 224
      target_height: 224
      episode_cache_size: 1
trainer:
  max_train_steps: 60000
  num_warmup_steps: 5000
  save_interval: 15000
  eval_interval: 100
  freeze_modules: qwen_vl_interface
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
