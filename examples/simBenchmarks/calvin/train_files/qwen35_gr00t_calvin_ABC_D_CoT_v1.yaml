run_id: qwen35_gr00t_calvin_ABC_D_CoT_v1
run_root_dir: /root/data/yxz/outputs/calvin
seed: 42
wandb_entity: yao-xian-ze
wandb_project: CoT
is_debug: false
version_id: '0.21'

framework:
  name: QwenGR00TCoT
  qwenvl:
    base_vlm: /root/data/yxz/models/Qwen3.5-4B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
  geometry:
    depth_query_count: 8
    query_num_heads: 16
    query_layer_count: 2
    query_dropout: 0.0
    uvd_num_points: 4
    uvd_hand_count: 1
    uvd_depth_scale: 2.0
    depth_decoder_features: 256
    depth_decoder_stages: 3
    depth_output_size: 224
    lambda_action: 1.0
    lambda_depth_current: 0.14
    lambda_depth_future: 0.15
    lambda_uvd: 0.62
    lambda_geometry: 0.13

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
  vla_data:
    dataset_py: calvin_lerobot_datasets
    dataformat: lerobot
    data_root_dir: /root/data/yxz/datasets/calvin/lerobot_rerender
    dataset_name: calvin_task_ABC_D
    enable_cot_geometry: true
    # Calvin's `action` column is copied from official `rel_actions`; abs means no extra conversion.
    action_mode: abs
    include_state: false
    CoT_prompt: "Your task is {instruction}."
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av
    cot_geometry:
      action_horizon: 8
      uvd_num_points: 4
      uvd_hand_count: 1
      image_size: 224
      uvd_depth_scale: 2.0
      episode_cache_size: 1

trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  test_diagnostics:
    enabled: false
    num_samples: 4
    interval: 100
    save_predictions: true
    prediction_save_interval: 1000
    log_module_gradients: true
    module_gradient_interval: 100
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
